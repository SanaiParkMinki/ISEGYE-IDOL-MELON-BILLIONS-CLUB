name: 누적 합계 갱신

on:
  push:
    branches: [main]
    paths: ["data/input.txt"]
  workflow_dispatch:
    inputs:
      allow_decrease:
        description: "줄어든 숫자도 그대로 기록 (멜론이 숫자를 정정했을 때만 체크)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-total
  cancel-in-progress: false

jobs:
  total:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 합계 계산
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          INPUT_TIME=$(git log -1 --format=%cI -- data/input.txt)
          echo "input.txt 마지막 수정 시각: $INPUT_TIME"
          EXTRA=""
          if [ "${{ inputs.allow_decrease }}" = "true" ]; then EXTRA="--allow-decrease"; fi
          python scripts/aggregate.py --mode record --input-time "$INPUT_TIME" $EXTRA

      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/history.json docs/
          if git diff --cached --quiet; then
            echo "바뀐 내용이 없어요."
            exit 0
          fi
          git commit -m "📊 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 누적 합계 갱신"
          git pull --rebase
          git push
