name: 매일 00시 누적 합계

on:
  # 매일 한국 시간 00:00 (= UTC 15:00) 에 그날 기록을 확정
  schedule:
    - cron: "0 15 * * *"
  # input.txt 를 고치면 바로 미리보기 갱신 (기록은 00시에)
  push:
    branches: [main]
    paths: ["data/input.txt"]
  # Actions 탭에서 직접 실행
  workflow_dispatch:
    inputs:
      record:
        description: "지금 숫자를 오늘 날짜 기록으로 바로 확정할까요? (처음 시작할 때만 체크)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-total
  cancel-in-progress: false

jobs:
  total:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 합계 계산
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.record }}" = "true" ]; then
            python scripts/aggregate.py --mode record
          else
            python scripts/aggregate.py --mode preview
          fi

      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/history.json docs/
          if git diff --cached --quiet; then
            echo "바뀐 내용이 없어요."
            exit 0
          fi
          git commit -m "📊 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 누적 합계 갱신"
          git pull --rebase
          git push
